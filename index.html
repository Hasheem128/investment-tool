<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Mode Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #020617;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    .card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .result {
      margin-top: 15px;
      padding: 10px;
      background: #1f2937;
      border-radius: 8px;
    }
    .hidden { display: none; }
    footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>Investment Platform Mode & Depository Checker</header>  <div class="container"><!-- LOGIN SYSTEM -->
<div class="card" id="loginBox">
  <h3>User Login</h3>
  <input type="text" id="username" placeholder="Enter Username" />
  <input type="password" id="password" placeholder="Enter Password" />
  <button onclick="login()">Login</button>
  <p id="loginMsg"></p>
</div>

<!-- MAIN SYSTEM -->
<div class="card hidden" id="mainSystem">
  <h3>Search Investment Platform</h3>
  <input type="text" id="platformInput" placeholder="Enter platform name (eg: Groww, Zerodha)" />
  <button onclick="checkPlatform()">Check Details</button>
  <div class="result" id="resultBox"></div>
</div>

<!-- ADMIN PANEL -->
<div class="card hidden" id="adminPanel">
  <h3>Admin Control Panel</h3>
  <p>You have full power to modify platform data in code.</p>
</div>

  </div>  <footer>
    Super Functionality Version • Admin Enabled • Free Hosting Ready
  </footer><script>
// ================= USER DATABASE ==================
const users = [
  { username: "hasheem", password: "something", role: "admin" }
];

// ================= PLATFORM DATABASE ==================
const platforms = {
  "groww": {
    mode: "SOA",
    depository: "CDSL",
    shares: "CDSL",
    description: "Groww uses SOA structure for mutual funds and CDSL for share holdings."
  },
  "zerodha": {
    mode: "DEMAT",
    depository: "CDSL",
    shares: "CDSL",
    description: "Zerodha works fully on Demat mode and stores shares in CDSL."
  },
  "upstox": {
    mode: "DEMAT",
    depository: "CDSL",
    shares: "CDSL",
    description: "Upstox uses Demat structure via CDSL depository."
  },
  "paytm money": {
    mode: "SOA + DEMAT",
    depository: "NSDL & CDSL",
    shares: "BOTH",
    description: "Paytm Money supports both modes based on investment type."
  }
};

// ================= LOGIN FUNCTION ==================
function login() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const msg = document.getElementById('loginMsg');

  const user = users.find(user => user.username === u && user.password === p);

  if(user) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('mainSystem').classList.remove('hidden');

    if(user.role === "admin") {
      document.getElementById('adminPanel').classList.remove('hidden');
    }
  } else {
    msg.innerText = "Invalid credentials";
  }
}

// ================= PLATFORM SEARCH ==================
function checkPlatform() {
  const input = document.getElementById('platformInput').value.toLowerCase();
  const result = document.getElementById('resultBox');

  if(platforms[input]) {
    const p = platforms[input];
    result.innerHTML = `
      <strong>Platform:</strong> ${input.toUpperCase()}<br>
      <strong>Investment Mode:</strong> ${p.mode}<br>
      <strong>Depository Used:</strong> ${p.depository}<br>
      <strong>Shares Stored In:</strong> ${p.shares}<br>
      <strong>Description:</strong> ${p.description}
    `;
  } else {
    result.innerHTML = "Platform not found in database.";
  }
}
</script></body>
</html>
