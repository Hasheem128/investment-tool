<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Platform Checker</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#f1f5f9; margin:0; padding:0; }
    .container { max-width:900px; margin:40px auto; background:#1e293b; padding:20px; border-radius:12px; }
    h1,h2 { text-align:center; }
    input, button, select { padding:10px; margin:5px 0; width:100%; border-radius:8px; border:none; }
    button { background:#38bdf8; color:#000; font-weight:bold; cursor:pointer; }
    table { width:100%; border-collapse:collapse; margin-top:15px; }
    th, td { padding:10px; border-bottom:1px solid #334155; text-align:left; }
    .hidden { display:none; }
    .admin { background:#020617; padding:15px; border-radius:10px; margin-top:20px; }
    .admin-corner{position:fixed;top:15px;right:15px;background:#38bdf8;color:#000;padding:10px 15px;border-radius:20px;font-weight:bold;cursor:pointer;z-index:999;}
  </style>
</head>
<body>
<div class="admin-corner hidden" id="adminCorner">👑 Admin Panel</div>
<div class="container">
  <h1>Indian Investment Platform Checker</h1>
  <div id="loginBox">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p style="margin-top:10px;cursor:pointer;color:#38bdf8;" onclick="showForgot()">Forgot Password?</p>
  </div>
  <div id="forgotBox" class="hidden">
    <h2>Reset Admin Password</h2>
    <input type="text" id="mobile" placeholder="Enter Registered Mobile Number">
    <button onclick="sendOTP()">Send OTP</button>
    <input type="text" id="otp" placeholder="Enter OTP" class="hidden">
    <input type="password" id="newAdminPass" placeholder="New Password" class="hidden">
    <button onclick="verifyOTP()" id="verifyBtn" class="hidden">Verify & Reset</button>
    <button onclick="backToLogin()">Back to Login</button>
  </div>
  <div id="mainApp" class="hidden">
    <h2>Search Platform</h2>
    <input type="text" id="search" placeholder="Enter platform name..." onkeyup="searchPlatform()">
    <table>
      <thead>
        <tr>
          <th>Platform</th>
          <th>MF Mode</th>
          <th>Shares Mode</th>
          <th>Depository</th>
        </tr>
      </thead>
      <tbody id="resultTable"></tbody>
    </table>

    <div id="adminPanel" class="admin hidden">
      <h2>Admin Panel - Add New Platform</h2>
      <input id="pname" placeholder="Platform Name">
      <select id="mfmode">
        <option>SOA</option>
        <option>DEMAT</option>
        <option>BOTH</option>
      </select>
      <select id="dpmode">
        <option>CDSL</option>
        <option>NSDL</option>
        <option>BOTH</option>
      </select>
      <button onclick="addPlatform()">Add Platform</button>

      <h3 style="margin-top:20px;">Change Admin Password</h3>
      <input type="password" id="oldPass" placeholder="Current Password">
      <input type="password" id="newPass" placeholder="New Password">
      <button onclick="changePassword()">Update Password</button>
    </div>
  </div>
</div>
