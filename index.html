<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investment Intelligence Platform</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:0}
    .container{max-width:1100px;margin:40px auto;padding:20px}
    .card{background:#111827;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.5);padding:20px;margin-bottom:20px}
    h1,h2,h3{margin-top:0}
    input,select,button{padding:10px;border-radius:10px;border:none;margin:5px 0}
    button{background:#2563eb;color:white;cursor:pointer}
    button:hover{background:#1d4ed8}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th,td{padding:10px;border-bottom:1px solid #334155;text-align:left}
    .hidden{display:none}
  </style>
</head>
<body>

<div class="container" id="loginScreen">
  <div class="card" style="max-width:400px;margin:auto;">
    <h2>🔐 Secure Login</h2>
    <p>Enter credentials to access the system</p>
    <input type="text" id="username" placeholder="User ID" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <div id="loginError" style="color:#f87171;margin-top:10px;"></div>
  </div>
</div>

<div class="container hidden" id="app">
  <h1>📊 Investment Intelligence Platform</h1>

  <div class="card">
    <h2>🔍 Platform Checker</h2>
    <input type="text" id="platformSearch" placeholder="Enter Platform Name (e.g. Groww)"/>
    <button onclick="searchPlatform()">Check</button>
    <div id="result"></div>
  </div>

  <div class="card">
    <h2>📋 Platform Database</h2>
    <table>
      <thead>
        <tr>
          <th>Platform</th>
          <th>MF Mode</th>
          <th>Shares Depository</th>
        </tr>
      </thead>
      <tbody id="platformTable"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>⚙ Admin Panel</h2>
    <p>Logged in as: <b id="activeUser"></b></p>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<script>
const users = [{ username: 'hasheem', password: 'something', role: 'admin' }];

const platforms = [
  { name: 'Groww', mf: 'SOA + Demat', depository: 'CDSL' },
  { name: 'Zerodha Coin', mf: 'Demat', depository: 'CDSL' },
  { name: 'Paytm Money', mf: 'SOA + Demat', depository: 'NSDL' },
  { name: 'Upstox', mf: 'Demat', depository: 'CDSL' },
  { name: 'Kuvera', mf: 'SOA', depository: 'Not Required' },
  { name: 'ET Money', mf: 'SOA', depository: 'Not Required' },
  { name: 'Angel One', mf: 'SOA + Demat', depository: 'CDSL' }
];

const table = document.getElementById('platformTable');
platforms.forEach(p => {
  table.innerHTML += `<tr><td>${p.name}</td><td>${p.mf}</td><td>${p.depository}</td></tr>`;
});

function login(){
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const user = users.find(x => x.username === u && x.password === p);
  if(user){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('activeUser').innerText = user.username;
  }else{
    document.getElementById('loginError').innerText = 'Invalid credentials';
  }
}

function logout(){ location.reload(); }

function searchPlatform(){
  const val = document.getElementById('platformSearch').value.toLowerCase();
  const res = platforms.find(p => p.name.toLowerCase().includes(val));
  const output = document.getElementById('result');
  output.innerHTML = res 
    ? `✅ <b>${res.name}</b><br>MF Mode: ${res.mf}<br>Depository: ${res.depository}` 
    : '❌ Platform not found';
}
</script>

</body>
</html>
